# Bygger behållaren och publicerar den i GitHub Container Registry (ghcr.io).
#
# Efter varje push till main finns en färdig bild på
#   ghcr.io/<ägare>/utlaggssystem:latest
# som Portainer kan hämta. Ingen hemlighet behöver läggas upp: GITHUB_TOKEN
# skapas av GitHub själv och räcker för att skriva till projektets eget register.
#
# Paketet är privat från början. Ska Chalmers kunna hämta bilden utan
# inloggning behöver det göras publikt under Packages -> Package settings.

name: Bygg och publicera container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  kontroll:
    name: Typkontroll och lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typkontroll
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src scripts

  bygg:
    name: Bygg och publicera
    runs-on: ubuntu-latest
    needs: kontroll
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Vid pull request byggs bilden men publiceras inte.
      - name: Logga in mot ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Räkna ut taggar
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Bygg och publicera
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Sparar bygget mellan körningar, så att en ny version tar minuter
          # i stället för att bygga om allt från början.
          cache-from: type=gha
          cache-to: type=gha,mode=max
